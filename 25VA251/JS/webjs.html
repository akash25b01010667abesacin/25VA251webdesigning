


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    // 1. Primitives
var myName = "Akash";
console.log("Name:", myName, "| Type:", typeof myName);

// Number
var mobNum = 987654345;
console.log("Mobile:", mobNum, "| Type:", typeof mobNum);

// Boolean
var isMarried = false;
console.log("Is Married:", isMarried, "| Type:", typeof isMarried);

// Null (Note: typeof null is "object" - a famous JS quirk!)
var myEmail = null;
console.log(myName + "'s email is " + myEmail);
console.log("Type of null:", typeof myEmail);

// BigInt
var myValue = BigInt(2345678); 
console.log("BigInt Value:", myValue, "| Type:", typeof myValue);

// Symbol (Unique identifiers)
var val1 = Symbol("Hello");
var val2 = Symbol("Hello");
console.log("Are symbols equal?", val1 === val2); // Returns false

// 2. Reference Types (Objects & Arrays)
let myInfo = {
    name: "Akash",
    age: 18,
    branch: "CSE",
    section: 18,
};

console.log("Object:", myInfo);
console.log("Keys count:", Object.keys(myInfo).length);
console.log("Branch:", myInfo.branch);

let student = ["akash", 18, "CSE"];
console.log("Array:", student);
console.log("Array Length:", student.length);

// 3. Function
function myCal() {
    let num1 = 5;
    let num2 = 10;
    let result = num1 + num2;
    return result; // Added return so you can use the value
}

console.log("Function Result:", myCal());
  </script>
</body>
</html>
