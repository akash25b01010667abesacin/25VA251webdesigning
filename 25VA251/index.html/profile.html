<!DOCTYPE html>
<html lang="en">
<head>

    <title>My Profile | Intro Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="profile-card">
        <div class="image-container">
            <img src="https://cdn.pixabay.com/photo/2023/02/18/11/00/icon-7797704_1280.png" alt="Profile Picture">
        </div>
        
        <h1>Akash Chourasia</h1>

        <div class="bio">

        </div>

        <div class="skills">
            <span>HTML5</span>
            <span>CSS3</span>

        <div class="social-links">

        </div>
        
        <button class="contact-btn">Get In Touch</button>
